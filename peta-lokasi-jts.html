<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lokasi EVCS dan BSS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 24px;
    background: #f5f5f4;
    color: #1a1a1a;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: #6b6b68; font-size: 14px; margin: 0 0 20px; }
  .card {
    background: #fff;
    border: 1px solid #e5e5e3;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .controls input, .controls select {
    padding: 9px 12px;
    border: 1px solid #d4d4d2;
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
  }
  .controls input { flex: 1; min-width: 200px; }
  .controls select { min-width: 170px; }
  .dist-filter-wrap { position: relative; width: 190px; flex: 0 0 auto; }
  .dist-filter-btn {
    width: 100%; text-align: left; padding: 9px 12px; border: 1px solid #d4d4d2;
    border-radius: 8px; font-size: 14px; background: #fff; cursor: pointer; color: #1a1a1a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dist-filter-btn:after { content: '▾'; float: right; color: #6b6b68; }
  .dist-filter-dropdown {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 10000; width: 220px; max-width: 80vw;
    background: #fff; border: 1px solid #d4d4d2; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    padding: 8px; max-height: 320px; display: flex; flex-direction: column;
  }
  .dist-filter-actions { display: flex; gap: 8px; padding: 4px 4px 8px; border-bottom: 1px solid #eee; margin-bottom: 6px; }
  .dist-filter-actions button {
    flex: 1; font-size: 12px; padding: 6px; border: 1px solid #d4d4d2; border-radius: 6px; background: #f5f5f4; cursor: pointer;
  }
  .dist-checklist { overflow-y: auto; }
  .dist-check-item { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 13.5px; cursor: pointer; border-radius: 6px; }
  .dist-check-item:hover { background: #f5f5f4; }
  .dist-check-item input { margin: 0; }
  .summary-row { display: flex; gap: 16px; font-size: 13px; color: #6b6b68; margin-bottom: 12px; flex-wrap: wrap; }
  .summary-row b { color: #1a1a1a; }
  #map { width: 100%; height: 480px; border-radius: 8px; border: 1px solid #e5e5e3; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-box { background: #f5f5f4; border-radius: 8px; padding: 14px 16px; }
  .stat-box .num { font-size: 24px; font-weight: 600; }
  .stat-box .label { font-size: 12px; color: #6b6b68; margin-top: 2px; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: #6b6b68; margin-top: 10px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  footer { text-align: center; font-size: 12px; color: #a3a3a1; margin-top: 24px; }

  @media (max-width: 640px) {
    body { padding: 12px; }
    h1 { font-size: 19px; }
    .subtitle { font-size: 13px; margin-bottom: 16px; }
    .card { padding: 14px; border-radius: 10px; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat-box { padding: 10px 12px; }
    .stat-box .num { font-size: 20px; }
    .controls { flex-direction: column; gap: 8px; }
    .controls input, .controls select { width: 100%; min-width: 0; font-size: 16px; }
    .dist-filter-wrap { width: 100%; }
    .dist-filter-dropdown { width: 100%; max-width: none; }
    .summary-row { font-size: 12px; gap: 10px; }
    #map { height: 320px; }
    .legend { gap: 10px; font-size: 11px; }
    .list-item { font-size: 12.5px; }
  }
</style>
</head>

<div class="container">
  <h1>Lokasi EVCS dan BSS</h1>
  <p class="subtitle">587 baris data &middot; 582 lokasi termapping &middot; filter district dan status update PM</p>

  <div class="stat-grid">
    <div class="stat-box"><div class="num" id="statTotal">587</div><div class="label">Total baris</div></div>
    <div class="stat-box"><div class="num" id="statMapped">582</div><div class="label">Termapping</div></div>

    <div class="stat-box"><div class="num" id="statNyDone">-</div><div class="label">Update PM: NY Done</div></div>
  </div>

  <div class="card">
    <div class="controls">
      <input id="search" type="text" placeholder="Cari nama lokasi atau station code..." />
      <div class="dist-filter-wrap">
        <button type="button" id="districtToggle" class="dist-filter-btn">Semua district</button>
        <div id="districtDropdown" class="dist-filter-dropdown" style="display:none;">
          <div class="dist-filter-actions">
            <button type="button" id="distSelectAll">Pilih semua</button>
            <button type="button" id="distClearAll">Kosongkan</button>
          </div>
          <div id="districtChecklist" class="dist-checklist"></div>
        </div>
      </div>
      <select id="pmStatus">
        <option value="">Semua status PM</option>
        <option value="1">Done</option>
        <option value="0">NY Done</option>
      </select>
    </div>
    <div class="summary-row">
      <span id="count"></span>
      <span id="pmSummary"></span>
    </div>
    <div id="map"></div>
    <div class="legend">
      <span><i class="dot" style="background:#16A34A"></i>Update PM: Done</span>
      <span><i class="dot" style="background:#DC2626"></i>Update PM: NY Done</span>
      <span><i class="dot" style="background:#993C1D"></i>Perlu dicek ulang (koordinat di luar area)</span>
    </div>
  </div>

  <footer>Dibuat dari file Database_JTS_-_BSS.csv</footer>
</div>

const map = L.map('map').setView([-6.28, 106.85], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

const districts = [...new Set(data.map(d => d[2]))].sort();
let selectedDistricts = new Set(districts); // default: semua district aktif
const districtToggle = document.getElementById('districtToggle');
const districtDropdown = document.getElementById('districtDropdown');
const districtChecklist = document.getElementById('districtChecklist');

districtChecklist.innerHTML = districts.map((d, i) => `
  <label class="dist-check-item">
    <input type="checkbox" class="dist-check" data-idx="${i}" checked>
    <span>${d}</span>
  </label>
`).join('');

function updateDistrictToggleLabel() {
  if (selectedDistricts.size === districts.length) districtToggle.textContent = 'Semua district';
  else if (selectedDistricts.size === 0) districtToggle.textContent = 'Tidak ada district dipilih';
  else districtToggle.textContent = `${selectedDistricts.size} district dipilih`;
}
updateDistrictToggleLabel();

districtToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  districtDropdown.style.display = districtDropdown.style.display === 'none' ? 'flex' : 'none';
});
document.addEventListener('click', (e) => {
  if (!districtDropdown.contains(e.target) && e.target !== districtToggle) {
    districtDropdown.style.display = 'none';
  }
});
districtChecklist.addEventListener('change', (e) => {
  if (!e.target.classList.contains('dist-check')) return;
  const d = districts[parseInt(e.target.dataset.idx, 10)];
  if (e.target.checked) selectedDistricts.add(d);
  else selectedDistricts.delete(d);
  updateDistrictToggleLabel();
  applyFilters();
});
document.getElementById('distSelectAll').addEventListener('click', () => {
  selectedDistricts = new Set(districts);
  districtChecklist.querySelectorAll('.dist-check').forEach(cb => cb.checked = true);
  updateDistrictToggleLabel();
  applyFilters();
});
document.getElementById('distClearAll').addEventListener('click', () => {
  selectedDistricts = new Set();
  districtChecklist.querySelectorAll('.dist-check').forEach(cb => cb.checked = false);
  updateDistrictToggleLabel();
  applyFilters();
});

const selPm = document.getElementById('pmStatus');

const dupeCodes = new Set();
dupeData.forEach(g => g.forEach(x => dupeCodes.add(x[1])));
const outareaCodes = new Set(outareaData.map(o => o[0]));

const doneTotal = data.filter(d => d[3] === 1).length;
document.getElementById('statDone').textContent = doneTotal;
document.getElementById('statNyDone').textContent = data.length - doneTotal;

let markers = [];
function render(list) {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  // Duplikat tidak ditampilkan di peta (tetap dihitung utuh di data lain, cuma tidak digambar).
  const mapList = list.filter(d => !dupeCodes.has(d[0]));
  mapList.forEach(d => {
    const [code, name, district, pm, lat, lng] = d;
    const flagged = outareaCodes.has(code);
    const color = flagged ? '#993C1D' : (pm === 1 ? '#16A34A' : '#DC2626');
    const m = L.circleMarker([lat, lng], {
      radius: flagged ? 7 : 5, color: color, fillColor: color, fillOpacity: 0.85, weight: flagged ? 2 : 1.2
    }).addTo(map);
    m.bindPopup(`<b>${name}</b><br>${code}<br>${district}<br>Update PM: ${pm===1?'Done':'NY Done'}${flagged ? '<br><span style="color:#993C1D">Perlu dicek ulang (di luar area)</span>' : ''}`);
    markers.push(m);
  });
  document.getElementById('count').textContent = mapList.length + ' dari ' + data.length + ' titik termapping';
  const done = mapList.filter(d => d[3] === 1).length;
  const ny = mapList.length - done;
  document.getElementById('pmSummary').textContent = `Done: ${done} · NY Done: ${ny}`;
}
render(data);

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  const pm = selPm.value;
  const filtered = data.filter(d =>
    selectedDistricts.has(d[2]) &&
    (pm === '' || String(d[3]) === pm) &&
    (!q || d[1].toLowerCase().includes(q) || d[0].toLowerCase().includes(q))
  );
  render(filtered);
}
document.getElementById('search').addEventListener('input', applyFilters);
selPm.addEventListener('change', applyFilters);
</script>
